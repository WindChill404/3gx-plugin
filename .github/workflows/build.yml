name: Build plugin

# Builds the .3gx and attaches it to the run, so nobody needs a local devkitARM
# install. The devkitPro image already carries the toolchain, libctru and
# 3gxtool; CTRPluginFramework is the one piece it doesn't ship, so it's built
# here and installed as libctrpf where the Makefile expects to find it.

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Check out this plugin
        uses: actions/checkout@v4

      - name: Build and install CTRPF
        run: |
          set -eux
          git clone --depth 1 https://github.com/Tekito-256/CTRPluginFramework.git /tmp/ctrpf
          cd /tmp/ctrpf
          make dist-bin
          mkdir -p "$DEVKITPRO/libctrpf"
          tar xf dist-bin/libctrpf-*.tar.gz -C "$DEVKITPRO/libctrpf"   
    
      - name: Build the plugin
        shell: bash
        run: |
          set -eux
          export DEVKITARM="$DEVKITPRO/devkitARM"
          export CTRPFLIB="$DEVKITPRO/libctrpf"
          make -j"$(nproc)"
          ls -la *.3gx

      - name: Upload the plugin
        uses: actions/upload-artifact@v4
        with:
          name: plugin-3gx
          path: "*.3gx"
          if-no-files-found: error
