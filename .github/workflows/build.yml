name: Build plugin

# Builds the .3gx and attaches it to the run, so nobody needs a local devkitARM
# install. The devkitPro image already carries the toolchain, libctru and
# 3gxtool; CTRPluginFramework is the one piece it doesn't ship, so it's built
# here and installed as libctrpf where the Makefile expects to find it.

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Check out this plugin
        uses: actions/checkout@v4
    
      - name: Build and install CTRPF
        run: |
          set -eux
          git clone --depth 1 --branch develop https://gitlab.com/thepixellizeross/ctrpluginframework.git /tmp/ctrpf
          cd /tmp/ctrpf/Library
          sed -i 's/-Werror//g' Makefile
          make dist-bin
          mkdir -p "$DEVKITPRO/libctrpf"
          cp -r lib "$DEVKITPRO/libctrpf/"
          cp -r include "$DEVKITPRO/libctrpf/"
          ls "$DEVKITPRO/libctrpf/lib/" "$DEVKITPRO/libctrpf/include/"  

      - name: Install 3gxtool
        run: |
          set -eux
          apt-get update && apt-get install -y libyaml-cpp-dev
          git clone --depth 1 https://github.com/Nanquitas/3gxtool.git /tmp/3gxtool
          cd /tmp/3gxtool
          g++ -O2 -std=gnu++11 \
            -I includes -I /usr/include/yaml-cpp \
            -o 3gxtool \
            sources/*.cpp \
            -lyaml-cpp
          cp 3gxtool /usr/local/bin/
          3gxtool --help   
    
      - name: Build the plugin
        shell: bash
        run: |
          set -eux
          export DEVKITARM="$DEVKITPRO/devkitARM"
          export CTRPFLIB="$DEVKITPRO/libctrpf"
          export PATH="$DEVKITARM/bin:$PATH"
          make
          ls -la *.3gx
    
      - name: Upload the plugin
        uses: actions/upload-artifact@v4
        with:
          name: plugin-3gx
          path: "*.3gx"
          if-no-files-found: error
